---

# =============================================================================
# Dependabot Configuration
# =============================================================================
#
# Ecosystems this repo actually has: npm (package.json), GitHub Actions
# (.github/workflows), Docker (the Dockerfiles in .devcontainer/,
# src/.devcontainer/ and src/devcontainer/) and Dev Containers
# (.devcontainer/devcontainer.json and src/.devcontainer/devcontainer.json).
# `.gitmodules` is empty, so no gitsubmodule entry. Updates target the
# dev branch (work lands on dev; main stays the default branch).
#
# Grouped so a week is a few PRs, not ten: minor and patch bumps land in one
# PR per group; major bumps stay individual PRs.
# =============================================================================

version: 2

updates:

  # npm dependencies
  # ===========================================================================

  -
    package-ecosystem: "npm"
    target-branch: "dev"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    commit-message:
      prefix: "dependabot-npm"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    groups:
      stylescape:
        patterns:
          - "stylescape"
          - "@*/stylescape-*"
          - "unit.gl"
          - "hue.gl"
      dev-tooling:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"


  # GitHub Actions dependencies
  # ===========================================================================

  -
    package-ecosystem: "github-actions"
    target-branch: "dev"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    commit-message:
      prefix: "dependabot-github-actions"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"


  # Docker dependencies
  # ===========================================================================

  -
    package-ecosystem: "docker"
    target-branch: "dev"
    directories:
      - "/.devcontainer"
      - "/src/.devcontainer"
      - "/src/devcontainer"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    commit-message:
      prefix: "dependabot-docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"


  # devContainer dependencies
  # ===========================================================================

  -
    package-ecosystem: "devcontainers"
    target-branch: "dev"
    directories:
      - "/"
      - "/src"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    commit-message:
      prefix: "dependabot-devcontainer"
      include: "scope"
    labels:
      - "dependencies"
      - "devcontainer"
